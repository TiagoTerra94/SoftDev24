<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    
    <!--Boostrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!--JS-->    
    <script src="main.js"></script>
</head>

<body style="background-color: bisque;">
    <h1>Minha Calculadora</h1>

    <!--Resultado-->
    <div>
        <h2 id="textoResultado"></h2>
    </div>
<div class="container justify-content-center">
    <!--Input Valor A-->
    <div>
        <span class="input-group-text">Input A: </span>
        <input type="number" id="inputValorA">
    </div>

    <!--Input Valor B-->
    <div>
        <span class="input-group-text input-group-lg">Input B: </span>
        <input type="number" id="inputValorB">
    </div>

    <!--Tipo Operador-->
    <div>
        <span class="input-group-text">Tipo de operador:</span>
        <input type="text" id="tipoOperador">
    </div>

    <!--Botão para chamar função calcular-->
    <button type="button" class="btn btn-success" onclick="calcular()">Calcular</button>
</div>
</body>

</html>
