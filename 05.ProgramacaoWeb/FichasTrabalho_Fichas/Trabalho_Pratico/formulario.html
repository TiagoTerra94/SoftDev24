<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class= "bg-danger-subtle rounded">
<br>
<!--Logo Pagina-->
<div class="text-center">
  <img src="Logo/android-chrome-192x192.png" alt="Não foi possível carregar">
</div>
<br>
<div>
  <h1 class="text-center">Porque nos importamos e queremos mais fofocas</h1>
</div>
  <!--Formulario-->
  <fieldset>
    <div class="mb-3">
        <label for="exampleFormControlInput1" class="form-label">Nome</label>
        <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Insira aqui o seu nome">
        <label for="exampleFormControlInput1" class="form-label">Email:</label>
        <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="Insira aqui o seu email">
      </div>
      <label for="exampleFormControlInput1" class="form-label">Assunto:</label>
      <select class="form-select" aria-label="Default select example">
        <option selected>-</option>
        <option value="1">Reclamações</option>
        <option value="2">Redação</option>
        <option value="3">Editores</option>
        <option value="4">Sugestões</option>
        <option value="5">Outros Assuntos</option>
      </select>
      <div class="mb-3">
        <label for="exampleFormControlTextarea1" class="form-label">Mensagem:</label>
        <textarea class="form-control" id="exampleFormControlTextarea1" rows="3" placeholder="Escreve aqui o que te vai na alma"></textarea>
      </div>
    </fieldset>
      <div class="col-12">
        <button class="btn btn-primary" type="submit">Enviar</button>
      </div>
<br>
<hr>
      <footer>
        <h6 class="text-left">@2024 Para tu Veres e Companhia</h6>
      </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
